[package]
name = "flag-removal-map"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Map feature-flag evidence and repository references into a safe removal plan"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-flag-removal-map"
homepage = "https://flag-removal-map.sociobot.in"
readme = "README.md"
keywords = ["feature-flags", "cli", "devtools", "cleanup"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", "dist/", ".factory/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
